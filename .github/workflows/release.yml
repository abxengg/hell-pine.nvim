name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --headless -u NONE -l tests/smoke.lua
      - name: Attach the extras
        run: |
          tar czf hell-pine-extras.tar.gz extras
          gh release create "$GITHUB_REF_NAME" hell-pine-extras.tar.gz --title "Hell Pine for Neovim $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
